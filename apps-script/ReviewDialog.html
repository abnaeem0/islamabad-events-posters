<!DOCTYPE html><html><head><base target="_blank"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial,sans-serif;color:#1d2936;margin:16px;background:#fafbfc}h2{font-size:19px;margin:0 0 6px}.muted{color:#65717f;font-size:12px}.posters{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.poster{background:white;border:1px solid #ddd;padding:10px;border-radius:8px}.poster img{display:block;max-height:260px;max-width:100%;margin:auto;object-fit:contain}.poster a{display:block;margin-top:8px;font-size:12px}.fields{margin-top:14px;max-height:290px;overflow:auto;border:1px solid #ddd;background:white}.field{display:grid;grid-template-columns:130px 1fr 1fr 1.15fr;gap:9px;align-items:center;padding:7px 10px;border-bottom:1px solid #eee}.field.changed{background:#fff9e8}.field label{font-weight:bold;font-size:12px}.field button{font-size:12px;text-align:left;overflow-wrap:anywhere;background:white;border:1px solid #ddd;border-radius:4px;padding:8px;cursor:pointer}.field button.chosen{border:2px solid #2670ac;background:#edf6ff}.field input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:4px}.actions{position:sticky;bottom:0;background:#fafbfc;padding:12px 0;border-top:1px solid #ccc;display:flex;align-items:center;gap:8px;flex-wrap:wrap}button.primary{background:#145c97;color:white;border:0;padding:12px 20px;border-radius:5px;cursor:pointer}select{padding:10px}#status{font-size:13px;color:#585858}.small{font-size:11px;color:#777}
</style></head><body>
<h2 id="heading">Loading event…</h2><div class="muted" id="reason"></div>
<div class="posters"><div class="poster"><b>Existing event / source</b><img id="leftImg" alt="Original poster"><a id="leftLink" target="_blank">Open original poster</a></div><div class="poster"><b>Incoming poster</b><img id="rightImg" alt="New poster"><a id="rightLink" target="_blank">Open incoming poster</a></div></div>
<p class="muted">Click either extracted value to use it, or type a correction in the final field. Blank values can be filled manually. All raw extractions remain unchanged.</p>
<div class="fields" id="fields"></div>
<div class="actions"><select id="decision"><option value="edit">Save corrected event</option><option value="merge">Merge with suggested event</option><option value="separate">Keep as separate event</option><option value="dismiss">Dismiss warning (keep corrections)</option></select><button class="primary" id="save">Save decision</button><span id="status"></span></div>
<script>
const context=JSON.parse(<?!= JSON.stringify(context) ?>);let data=null;const fields=['title','start_date','end_date','start_time','end_time','venue','address','organizer','price','contact','registration_url','description','categories','age_info','source_account'];
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function render(d){data=d;document.getElementById('heading').textContent=d.title||'Untitled event';document.getElementById('reason').textContent=d.reviewReason||'';
[['left',d.existingImage,d.existingLink],['right',d.incomingImage,d.incomingLink]].forEach(([side,img,url])=>{const im=document.getElementById(side+'Img');im.src=img||'';im.style.display=img?'block':'none';const a=document.getElementById(side+'Link');a.href=url||'#';a.style.display=url?'block':'none'});
if(!d.suggestedGroupId)document.querySelector('#decision option[value="merge"]').disabled=true;
const host=document.getElementById('fields');host.replaceChildren();fields.forEach(k=>{let a=String(d.existing[k]||''),b=String(d.incoming[k]||'');const line=el('div','field'+(a!==b?' changed':''));line.append(el('label','',k.replace(/_/g,' ')));const input=el('input');input.dataset.key=k;input.value=a||b;const la=el('button','chosen',a||'—');const rb=el('button','',b||'—');la.type=rb.type='button';la.onclick=()=>{input.value=a;la.classList.add('chosen');rb.classList.remove('chosen')};rb.onclick=()=>{input.value=b;rb.classList.add('chosen');la.classList.remove('chosen')};input.oninput=()=>{la.classList.remove('chosen');rb.classList.remove('chosen')};line.append(la,rb,input);host.append(line)});
}
document.getElementById('save').onclick=function(){if(!data)return;const action=document.getElementById('decision').value;const fieldsOut={};document.querySelectorAll('input[data-key]').forEach(x=>fieldsOut[x.dataset.key]=x.value);const button=this;button.disabled=true;document.getElementById('status').textContent='Saving…';google.script.run.withSuccessHandler(x=>{document.getElementById('status').textContent='Saved. Close the dialog; Review tab has refreshed.';button.disabled=false}).withFailureHandler(e=>{document.getElementById('status').textContent='Error: '+e.message;button.disabled=false}).saveVisualDecision({action,fields:fieldsOut,mode:data.mode,sourceId:data.sourceId,groupId:data.groupId,suggestedGroupId:data.suggestedGroupId});};
google.script.run.withSuccessHandler(render).withFailureHandler(e=>document.getElementById('status').textContent=e.message).getVisualReviewData(context);
</script></body></html>
