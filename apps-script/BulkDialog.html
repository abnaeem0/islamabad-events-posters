<!doctype html><html><head><base target="_blank"><style>body{font:14px Arial;margin:20px;color:#253342}li{margin:9px 0}input,select,button{padding:9px;margin:5px}label{display:block}#status{white-space:pre-wrap}button{cursor:pointer}small{color:#667}</style></head><body>
<h2 id="heading"></h2><p id="explanation"></p><ul id="items"></ul>
<label id="typeBox">Category <select id="type"><option value="activity">Activity / club / gym</option><option value="experience">Experience</option><option value="course">Course / classes</option><option value="recurring_event">Recurring event / market</option><option value="attraction">Attraction</option><option value="day_trip">Day trip</option><option value="restaurant">Restaurant / cafe</option></select></label>
<div id="locationBox" hidden><label>Venue <input id="venue"></label><label>Address <input id="address"></label><p>Non-empty fields replace the selected entries’ values. Check the titles and existing venues above.</p></div>
<button id="apply">Confirm</button><button onclick="google.script.host.close()">Cancel / close</button><p id="status" role="status"></p>
<script>const context=JSON.parse(<?!= JSON.stringify(context) ?>);const $=id=>document.getElementById(id);$('heading').textContent={move:'Move selected to Places & Activities',copy:'Copy selected — keep Events',return:'Move selected back to Events',location:'Set shared venue / address'}[context.action];$('explanation').textContent=context.action==='return'?'Restore preserved event details and remove the activity entry. Past events stay archived. For copies, keep the existing event without creating another.':context.action==='move'?'Preserve the event for moving back later. Each listing stays separate.':context.action==='copy'?'Keep dated events and create independent activity entries.':'Apply the same location to every listed event; dates and titles stay separate.';context.items.forEach(item=>{const li=document.createElement('li');li.textContent=item.title+(item.venue?' — '+item.venue:' — no venue')+(item.legacyRestore?' — older move: saved event corrections may be unavailable':'');$('items').append(li)});$('typeBox').hidden=!['copy','move'].includes(context.action);$('locationBox').hidden=context.action!=='location';$('apply').onclick=function(){this.disabled=true;$('status').textContent='Saving…';google.script.run.withSuccessHandler(r=>{$('status').textContent='Saved '+r.count+' entries.';this.textContent='Saved'}).withFailureHandler(e=>{$('status').textContent=e.message;this.disabled=false}).saveBulkActions({...context,placeType:$('type').value,venue:$('venue').value,address:$('address').value})};</script></body></html>
