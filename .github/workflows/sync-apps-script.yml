name: Sync Apps Script

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
      - ".clasp.json"
      - ".github/workflows/sync-apps-script.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install -g @google/clasp@3.4.1

      - name: Configure Google login
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || { echo "Missing CLASPRC_JSON secret"; exit 1; }
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Upload code to Apps Script
        run: clasp push --force

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
